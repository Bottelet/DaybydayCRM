version: "3.8"

services:
  php:
    container_name: phpMain
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - .docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=db
      - DB_DATABASE=daybyday
      - DB_USERNAME=daybyday
      - DB_PASSWORD=daybyday
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    env_file:
      - docker-compose.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - 9000:9000
    networks:
      - service_net
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  db:
    container_name: dbMain
    image: mysql:8.0
    restart: unless-stopped
    volumes:
      - dbdata:/var/lib/mysql
      - .docker/db/db/:/docker-entrypoint-initdb.d
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: daybyday
      MYSQL_USER: daybyday
      MYSQL_PASSWORD: daybyday
      MYSQL_ALLOW_EMPTY_PASSWORD: "false"
    networks:
      - service_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  nginx:
    container_name: nginxMain
    build:
      context: .
      dockerfile: .docker/nginx/Dockerfile
    restart: unless-stopped
    volumes:
      - .docker/nginx/nginx-local.conf:/etc/nginx/nginx.conf
      - .:/var/www/html
    ports:
      - 80:80
      - 443:443
    depends_on:
      php:
        condition: service_healthy
    networks:
      - service_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:
    container_name: redisMain
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - 6379:6379
    networks:
      - service_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Chromium for Playwright e2e tests
  chrome:
    image: mcr.microsoft.com/playwright:v1.40.0-focal
    container_name: chrome
    restart: unless-stopped
    networks:
      - service_net
    ports:
      - 9515:9515
    cap_add:
      - SYS_ADMIN
    environment:
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright

volumes:
  redisdata:
    driver: local
  dbdata:
    driver: local

networks:
  service_net:
    driver: bridge
