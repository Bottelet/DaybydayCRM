services:
  php:
    container_name: phpMain
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - .docker/php/custom.ini:/usr/local/etc/php/php.ini
    depends_on:
      - db
    env_file:
        - docker-compose.env
    ports:
      - 9000:9000
    networks:
      - service_net

  chrome:
    image: robcherry/docker-chromedriver
    networks:
      - service_net
    environment:
      CHROMEDRIVER_WHITELISTED_IPS: ""
      CHROMEDRIVER_PORT: "9515"
    ports:
      - 9515:9515
    cap_add:
      - "SYS_ADMIN"
    links:
      - php
      - nginx:daybydaycrm.test

  db:
    container_name: dbMain
    image: mysql:8.0
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - 3306:3306
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=daybyday
    networks:
      - service_net

  nginx:
    container_name: nginxMain
    build:
      context: .
      dockerfile: ./.docker/nginx/Dockerfile
    volumes:
      - .docker/nginx/nginx-local.conf:/etc/nginx/nginx.conf
      - .:/var/www/html
    ports:
      - 80:80
    depends_on:
      - php
    networks:
      - service_net

  # Optional: disabled by default (see ELASTICSEARCH_ENABLED in docker-compose.env).
  # Start with: docker compose --profile elasticsearch up
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:6.4.1
    container_name: elasticsearchMain
    profiles:
      - elasticsearch
    environment:
      - cluster.name=docker-cluster
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata1:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    networks:
      - service_net

  elasticsearch2:
    image: docker.elastic.co/elasticsearch/elasticsearch:6.4.1
    container_name: elasticsearchSecond
    profiles:
      - elasticsearch
    environment:
      - cluster.name=docker-cluster
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - "discovery.zen.ping.unicast.hosts=elasticsearch"
      - "ELASTICSEARCH_MINIMUM_MASTER_NODES=2"
      - "discovery.zen.minimum_master_nodes=2"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
        - esdata2:/usr/share/elasticsearch/data
    networks:
      - service_net

  redis:
    image: 'redis:7-alpine'
    container_name: redisMain
    volumes:
      - redisdata:/data
    ports:
      - 6379:6379
    networks:
      - service_net

volumes:
  esdata1:
    driver: local
  esdata2:
    driver: local
  redisdata:
    driver: local
  dbdata:
    driver: local

networks:
    service_net:
      driver: bridge
