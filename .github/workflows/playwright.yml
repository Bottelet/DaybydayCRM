name: Playwright Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      stop_on_failure:
        description: 'Stop on first failure'
        required: false
        type: boolean
        default: false

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MYSQL_ROOT_PASSWORD: password
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: yarn

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqladmin ping -h127.0.0.1 -uroot --silent; then
              echo "MySQL ready!"
              break
            fi
            sleep 2
          done

      - name: Prepare app
        run: |
          cp .env.ci .env
          composer install --no-ansi --no-interaction --prefer-dist --optimize-autoloader
          php artisan key:generate
          php artisan config:clear
          php artisan cache:clear
          MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -h 127.0.0.1 -uroot -e "CREATE DATABASE IF NOT EXISTS daybyday_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          php artisan migrate:fresh --seed

      - name: Install dependencies
        run: |
          if [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            echo "No lockfile found (expected yarn.lock or package-lock.json)." >&2
            exit 1
          fi

      - name: Restore Playwright browsers cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright system dependencies
        run: npx playwright install-deps

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install

      - name: Start Laravel server
        run: php artisan serve --host=127.0.0.1 --port=8000 > /tmp/laravel-server.log 2>&1 &

      - name: Wait for Laravel server
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/login >/dev/null; then
              echo "Laravel server ready!"
              exit 0
            fi
            sleep 2
          done
          echo "Laravel server did not become ready in time." >&2
          exit 1

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
        run: |
          if [ "${{ github.event.inputs.stop_on_failure }}" = "true" ]; then
            npx playwright test --max-failures=1
          else
            npx playwright test
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: playwright-report
          path: |
            blob-report/
            storage/logs/e2e-*.json
            storage/logs/e2e-*.log
            /tmp/laravel-server.log
          if-no-files-found: warn
          retention-days: 3
