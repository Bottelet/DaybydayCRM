name: Docker Test

on:
  push:
    branches:
      - master
      - develop
    paths:
      - '.docker/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'Dockerfile'
      - '.github/workflows/docker-test.yml'
  pull_request:
    branches:
      - master
      - develop
    paths:
      - '.docker/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'Dockerfile'
      - '.github/workflows/docker-test.yml'

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose build --no-cache

      - name: Start containers
        run: docker compose up -d
        timeout-minutes: 5

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to be healthy..."
          for i in {1..60}; do
            if docker ps | grep -q "phpMain.*healthy" && \
               docker ps | grep -q "nginxMain.*healthy" && \
               docker ps | grep -q "dbMain.*healthy" && \
               docker ps | grep -q "redisMain.*healthy"; then
              echo "All services are healthy"
              exit 0
            fi
            echo "Attempt $i/60: Waiting for services..."
            sleep 5
          done
          echo "Services did not become healthy"
          docker compose logs
          exit 1

      - name: Test artisan route:list
        run: docker compose exec -T php php artisan route:list

      - name: View container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v
